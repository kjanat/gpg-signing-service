# Gitleaks configuration for GPG Signing Service.
#
# ## The one rule this file has to obey
#
# Nothing here may be able to suppress a finding it was not written for.
#
# gitleaks tests an allowlist regex against the finding with `MatchString`,
# which is a *substring* test, and the default `private-key` rule is
#
#   -{5}BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-{5}[\s\S-]{64,}?KEY( BLOCK)?-{4}
#
# so one match can span from a fixture's armor header all the way to some later
# `KEY-{5}`, swallowing whatever sits in between. An allowlist entry that
# matches only the *head* of such a span excuses the entire span -- real key
# bytes included. That is fail-open, and it is how the first attempt at this
# file (#146) hid a freshly generated RSA private key committed next to a test
# fixture while CI stayed green.
#
# Two things keep that from being possible now:
#
#   1. **The tracked tree needs no suppression at all.** Every armor marker in
#      a test, script or document is assembled at run time
#      (`src/__tests__/helpers/armor.ts`, `armor()` in `scripts/key-size.py`),
#      or described rather than printed (API.md, DEVELOPER_GUIDE.md), so the
#      detector never fires on a fixture and there is nothing to excuse. The
#      contract gate proves this: it scans the corpus with this config and with
#      a bare `useDefault` config and requires the two to agree, so any entry
#      below that ever starts reaching live code fails the build.
#
#   2. **Every entry is fully anchored.** `\A...\z` means gitleaks skips a
#      finding only when the *entire* rule match is byte-for-byte the historical
#      text named. A real key added inside such a span changes the span; a real
#      key added after it forms its own match. Neither is excused. The gate
#      asserts the anchors, so an unanchored entry cannot be added by accident.
#
# ## Version contract (issue #145)
#
# `gitleaks/gitleaks-action@v3` defaults `GITLEAKS_VERSION` to **8.24.3**, and
# 8.24.3 *silently ignores* the `[[allowlists]]` array-of-tables form that newer
# releases document -- it honours only the singular `[allowlist]` table. It also
# ignores `condition = "AND"`, so a `paths` + `regexes` allowlist degrades there
# into a blanket path exclusion. This file therefore uses the singular table and
# `regexes` only: no `paths`, no `commits`, no `condition`. `.mise.toml` pins
# the scanner to 8.24.3 and both workflows pass `GITLEAKS_VERSION: "8.24.3"`
# explicitly, so nothing here depends on an upstream default;
# `scripts/test-gitleaks-contract.sh` asserts all three agree.
#
# ## The historical corpus
#
# The entries below exist only because `gitleaks-action` scans
# `git log -p -U0 --full-history --all`, which reaches every pre-fix commit --
# and the tags and abandoned branches that survived the #111 rewrite. They pin,
# byte for byte, the fixture spans those commits contain. None is reachable from
# the current tree. They are content-keyed rather than SHA-keyed so a future
# history rewrite cannot stale them out the way it staled `.gitleaksignore`, and
# the armor markers inside them are written `-{5}` rather than spelled out so
# this file does not become a finding of the rule it configures.
#
# Where a match starts and stops is itself version-dependent -- 8.30.1 ends a
# `private-key` span at the armor footer where 8.24.3 runs past it to the next
# `KEY-----` -- so the list carries both sets of boundaries. Verified clean, tree
# and full `--all` history, under 8.24.3, 8.25.0, 8.28.0 and 8.30.1. A scanner
# whose spans match neither reports the fixtures again, which is failing closed.
#
# Adding one is not a routine act. If a scan reports something new: classify it,
# and if it is a fixture, change the fixture's representation the way the ones
# above were changed. An entry here is only correct for text that is already
# immutable.
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Fixture spans that exist only in pre-fix history (#145, #146)"
regexTarget = "match"
regexes     = [
