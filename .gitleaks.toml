# Gitleaks configuration for GPG Signing Service
title = "gitleaks config"

[extend]
useDefault = true

# Allowlist for test files and documentation with PGP examples
[[allowlists]]
description = "Test fixtures and examples with PGP keys"
paths       = [
  '''src/__tests__/.*\.test\.ts$''',
  '''scripts/.*''',
  '''API\.md$''',
  '''README\.md$''',
  '''examples/.*''',
]

# Skip specific commits that introduced test fixtures
[[allowlists]]
description = "Commits introducing test fixtures"
commits     = [
  "21e000ed60165c243ec387af3f14cff0169d1f4e",      # scripts/key-size.py PGP test fixture
  "4b6fe507bc8c2ec1e65d69969f00bd897e1577b9",      # scripts/generate-key.sh example curl
  "0deeb13eee38f309dbf5137192a616ef52b9993d",      # API.md documentation example
]

[[allowlists]]
description = "PGP armor headers in scripts are markers, not key material"
regexes     = ['''-----BEGIN PGP''']
paths       = ['''scripts/.*''']

[[allowlists]]
description = "Placeholder auth tokens in example scripts"
regexes     = ['''Authorization: Bearer \*+''']
paths       = ['''scripts/generate-key\.sh''']
