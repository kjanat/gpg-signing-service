#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

monorepo_root = true

[tools]
biome         = { prefix = "2.6" }
bun           = { prefix = "1.4" }
gitleaks      = { prefix = "8" }
go            = "latest"
golangci-lint = { prefix = "2.15" }
kprint        = "latest"
lefthook      = "latest"
node          = "26"
runner-run    = "latest"
shellcheck    = "latest"
task          = "latest"
tombi         = { prefix = "1" }
typescript    = { filter_bins = ["tsc"], version = "latest" }
uv            = { prefix = "0.13" }
syft          = "latest"

[tools."http:actionlint"]
version          = "343"
url              = 'https://pkg.pr.new/kjanat/actionlint/@kjanat-actionlint/actionlint-{{ os(macos="darwin", windows="win32") }}-{{ arch() }}@{{ version }}'
format           = "tar.gz"
strip_components = 1
bin_path         = "bin"

[tools.wrangler]
version      = "4.158.0"
allow_builds = ["esbuild", "sharp", "workerd"]

[tools."github:kjanat/shellcheck-rs"]
version       = "latest"
asset_pattern = 'rshellcheck-*-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(linux="unknown-linux-musl", macos="apple-darwin", windows="pc-windows-msvc") }}.*'

[tool_alias]
kprint     = "github:kjanat/kprint"
runner-run = "github:kjanat/runner"
tombi      = "github:tombi-toml/tombi"
typescript = "github:Microsoft/TypeScript"
shellcheck = "github:koalaman/shellcheck"

[wrappers.dprint]
command = "kprint"

[settings]
minimum_release_age_excludes        = [
  "github:Microsoft/TypeScript",
  "github:kjanat/kprint",
  "github:kjanat/runner",
  "github:kjanat/shellcheck-rs",
]
idiomatic_version_file_enable_tools = ["go"]

[monorepo]
config_roots = ["."]
