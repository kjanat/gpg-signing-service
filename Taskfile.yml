# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
---
version: "3"

includes:
  client:
    taskfile: ./client
    dir: ./client
    flatten: false
    aliases: [gpg-sign, c]

vars:
  DATABASE_NAME: gpg-signing-audit
  KV_NAMESPACE: JWKS_CACHE
  DPRINT_CONFIG: .dprint.jsonc

dotenv: [.dev.env]

tasks:
  default:
    desc: Show available tasks
    cmd: "{{.TASK_EXE}} --taskfile {{.TASKFILE}} --list-all"

  dev:
    desc: Start development server
    aliases: [d]
    cmd: mise exec -- wrangler dev

  deploy:
    desc: Deploy to production Cloudflare Workers
    prompt:
      - "Are you sure?"
      - "This will affect live users!"
    cmd: wrangler deploy --env=''

  deploy:staging:
    desc: Deploy to staging Cloudflare Workers
    prompt:
      - "Are you sure?"
      - "This will affect staging users!"
    cmd: wrangler deploy --env staging

  test:
    desc: Run tests
    aliases: [t]
    deps: [install:noscripts]
    cmds:
      - bun run test
      - task: test:gnupg-interop
      - task: test:signing-shim
      - task: test:signing-preflight
      - task: test:sign-commits
      - task: test:repair-history
      - task: test:commit-provenance
      - task: test:sign-commit-example
      - task: test:review-gate
      - task: test:dependabot-fix
      - task: test:agent-harness
      - task: test:session-start
      - task: test:go-modernize-gate
      - task: test:typegen-pin

  test:sentry:
    desc: Run the Sentry boundary suite alone — the inner loop of the mutation set
    aliases: [tse, sentry]
    deps: [install:noscripts]
    # Coverage is on by default in vitest.config.ts and its thresholds are
    # global, so a single-file run trips them on the 33 files it did not load.
    # `task test:coverage` is what enforces them; this is the fast inner loop.
    cmd: bun run test --coverage.enabled=false src/__tests__/sentry.test.ts

  test:gnupg-interop:
    desc: Verify signatures against real gpg and git (skips if gpg is absent)
    aliases: [interop]
    cmd: bash scripts/test-gnupg-interop.sh

  test:signing-shim:
    desc: Test the Git commit signing shim credential paths
    cmd: bash .github/scripts/test-gpg-sign-git-program.sh

  test:signing-preflight:
    desc: Test the CI signing preflight, its escape hatch and its failure classes
    cmd: bash .github/scripts/test-signing-preflight.sh

  test:sign-commits:
    desc: Test commit re-signing behavior
    cmd: bash .github/scripts/test-sign-commits.sh

  test:repair-history:
    desc: Test the pre-push assertions guarding a history repair
    cmd: bash .github/scripts/test-repair-history.sh

  test:commit-provenance:
    desc: Test the guard against merge paths that manufacture identity headers
    cmd: bash .github/scripts/test-commit-provenance.sh

  test:sign-commit-example:
    desc: Test the Bash example's retry, clamping and transport handling
    cmd: bash .github/scripts/test-sign-commit-example.sh

  test:review-gate:
    desc: Test the Claude review job's no-token gate and its fork path
    cmd: bash .github/scripts/test-claude-review-gate.sh

  test:dependabot-fix:
    desc: Test the trusted Dependabot write path's authorization, allowlist and privilege boundary
    aliases: [dbf]
    cmd: bash .github/scripts/test-dependabot-fix.sh

  test:agent-harness:
    desc: Test the @claude agent-mode harness's owner gate, ref selection and publishing guards
    aliases: [ah]
    cmd: bash .github/scripts/test-claude-agent-harness.sh

  test:session-start:
    desc: Test the cloud-session hook's shared mise tree, trust and install gating
    cmd: bash scripts/test-session-start-hook.sh

  test:go-modernize-gate:
    desc: Test that a pending Go modernization fails CI (skips if go is absent)
    aliases: [mg]
    cmd: bash scripts/test-go-modernize-gate.sh

  test:typegen-pin:
    desc: Test that worker-configuration.d.ts has one pinned producer
    aliases: [tgp]
    cmd: bash scripts/test-typegen-pin.sh

  test:coverage:
    desc: Run tests with coverage
    aliases: [tc]
    deps: [install:noscripts]
    cmds:
      # The shell suites carry no coverage, but `tc` is what .lefthook.yml runs
      # on pre-push and what CLAUDE.md points contributors at, so it has to be a
      # superset of `test` or these two never run outside CI.
      - bun run test:coverage
      - task: test:gnupg-interop
      - task: test:signing-shim
      - task: test:signing-preflight
      - task: test:sign-commits
      - task: test:repair-history
      - task: test:commit-provenance
      - task: test:sign-commit-example
      - task: test:review-gate
      - task: test:dependabot-fix
      - task: test:agent-harness
      - task: test:session-start
      - task: test:go-modernize-gate
      - task: test:typegen-pin

  test:watch:
    desc: Run tests in watch mode
    aliases: [tw]
    deps: [install:noscripts]
    cmd: bun run test:watch

  lint:
    desc: Lint code
    aliases: [l]
    deps: [install:noscripts]
    cmds:
      - task: format
      - bun eslint src/
      - mise exec -- biome lint
      - task: lint:shell
      - task: lint:actions

  lint:shell:
    desc: Shellcheck the CI scripts, the cloud-session hook and their test suites
    aliases: [ls, sh]
    # Directories enumerated rather than discovered: these are the ones that
    # hold shell this repo owns, and a find(1) sweep would silently stop
    # covering a new one the day someone adds .github/actions/*/entrypoint.sh.
    # examples/bash is in here because test:sign-commit-example runs it.
    # -x follows `source` directives, so a sourced helper is checked in the
    # context of its caller rather than reported as an unresolved include.
    cmd: mise exec -- shellcheck -x .github/scripts/*.sh scripts/*.sh .claude/hooks/*.sh examples/bash/*.sh

  lint:actions:
    desc: Static-check the GitHub Actions workflows
    aliases: [la, actions]
    # The @claude workflow is now a hand-written agent-mode harness whose `if:`
    # is the only thing standing between a public comment and a job holding
    # contents: write and unrestricted Bash. A typo in that expression is a
    # silently-true condition, and no test run reaches it — actionlint does.
    #
    # workflows-pending/ is included because that is where the workflows this
    # repository's own automation cannot push wait for a human `git mv`. They
    # are the ones nobody has run yet, so they are the ones most worth linting.
    cmd: >-
      find .github/workflows .github/workflows-pending -maxdepth 1 -name '*.yml' 2>/dev/null
      | xargs -r mise exec -- actionlint

  lint:fix:
    desc: Lint and fix code
    aliases: [lf]
    deps: [install:noscripts]
    cmds:
      - bun lint:eslint:fix
      - mise exec -- bun lint:biome:fix
      - defer: { task: format }

  format:
    silent: true
    desc: Format code
    aliases: [fmt, f]
    env:
      CONFIG: "{{.DPRINT_CONFIG}}"
      DPRINT_CONFIG_DISCOVERY: 0
    cmds:
      - task: client:format
      - dprint fmt {{.CLI_ARGS}} --config "${CONFIG}" --allow-no-files

  format:check:
    silent: true
    desc: Check code formatting
    aliases: [fc]
    deps: [install:noscripts]
    env:
      CONFIG: "{{.DPRINT_CONFIG}}"
      DPRINT_CONFIG_DISCOVERY: 0
    cmd: dprint check {{.CLI_ARGS}} --config "${CONFIG}" --allow-no-files

  format:staged:
    silent: true
    desc: Format staged files with dprint
    aliases: [fs]
    env:
      CONFIG: "{{.DPRINT_CONFIG}}"
      DPRINT_CONFIG_DISCOVERY: 0
    cmd: dprint fmt --staged --config "${CONFIG}" --allow-no-files

  typecheck:
    desc: Typecheck code
    aliases: [ts, type, tsc, tsgo]
    deps: [install:noscripts]
    sources: ["**/*.ts"]
    cmd: mise exec -- run typecheck

  typegen:
    desc: Generate Worker types
    aliases: [tg]
    deps: [install:noscripts]
    sources: ["**/*.ts"]
    generates: [worker-configuration.d.ts]
    # Spelled through the package.json script, not `mise exec -- wrangler`, so
    # that this and the `prepare` hook are the same command. They were not, and
    # the two resolved different wranglers: `.mise.toml` carries an unpinned
    # `wrangler = "latest"`, while `run typegen` picks up node_modules/.bin,
    # which bun.lock pins exactly as a transitive dep of vitest-pool-workers.
    # Whichever one wrote worker-configuration.d.ts last stamped its own workerd
    # into the header, so `bun install` inside CI -- which fires `prepare` and
    # therefore the node_modules one -- rewrote a file generated here by the
    # mise one and turned the whole-worktree `git diff --exit-code` in
    # .github/actions/check-api-changes red, on a tree where `task generate:api`
    # itself is clean (#123). Only this call site moves: the lockfile wrangler
    # is the one whose workerd the vitest-pool-workers suite actually executes
    # on, so it is the one whose types belong in the tree, whereas deploy/d1/kv
    # emit no committed artifact and are better off current.
    # scripts/test-typegen-pin.sh holds both halves of that down.
    cmd: mise exec -- run typegen

  generate:api:
    desc: Generate OpenAPI spec and client
    aliases: [gapi, gen]
    deps: [install:noscripts]
    sources: ["**/*.ts"]
    generates: [client/openapi.json]
    cmds:
      - bun run generate:oapigen
      - task: client:generate

  generate:key:
    desc: Generate GPG key
    aliases: [gpg]
    generates: [./.keys]
    cmd: bash scripts/generate-key.sh

  db:create:
    desc: Create D1 database
    status:
      - mise exec -- wrangler d1 list --json | jq -e 'map(.name) | contains(["{{.DATABASE_NAME}}"])'
    cmd: mise exec -- wrangler d1 create {{.DATABASE_NAME}}

  db:migrate:
    desc: Apply pending production D1 migrations
    prompt:
      - "Are you sure?"
      - "This will affect live users!"
    cmd: wrangler d1 migrations apply AUDIT_DB --remote

  db:migrate:local:
    desc: Apply pending local D1 migrations
    cmd: wrangler d1 migrations apply AUDIT_DB --local

  db:migrate:staging:
    desc: Apply pending staging D1 migrations
    prompt:
      - "Are you sure?"
      - "This will affect staging users!"
    cmd: wrangler d1 migrations apply AUDIT_DB --remote --env staging

  kv:create:
    desc: Create KV namespace
    aliases: [kvc]
    status:
      - mise exec -- wrangler kv namespace list | jq -e 'map(.title) | contains(["{{.KV_NAMESPACE}}"])'
    cmd: mise exec -- wrangler kv namespace create {{.KV_NAMESPACE}}

  install:
    desc: Install dependencies
    silent: true
    cmd: bun install

  install:noscripts:
    desc: Install dependencies without scripts
    silent: true
    cmd: bun install --ignore-scripts >/dev/null
