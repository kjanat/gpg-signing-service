name: CI
on: { push: &Master { branches: [master] }, pull_request: *Master }

jobs:
  verify-api: {
    name: Verify API Generation,
    runs-on: &Ubuntu ubuntu-latest,
    steps: [
      &Check { uses: &CheckoutAction actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 }, # v7.0.1
      { uses: $/.github/actions/check-api-changes, with: &WithMiseVer { mise-version: &MiseVer "${{ vars.MISE_VERSION }}" } },
    ],
  }

  format: { name: Format check, runs-on: *Ubuntu, steps: [*Check, { uses: $/.github/actions/check-formatting, with: *WithMiseVer }] }

  typecheck: {
    name: Typecheck,
    runs-on: *Ubuntu,
    steps: [
      *Check,
      &Mise { uses: &MiseAction jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c, with: { version: *MiseVer } }, # v4.3.0
      &Bun { uses: $/.github/actions/setup-bun },
      run: task typecheck,
    ],
  }

  lint: {
    name: Lint,
    runs-on: *Ubuntu,
    steps: [
      *Check,
      &MiseGo { uses: *MiseAction, with: { working_directory: client, version: *MiseVer } },
      *Bun,
      { uses: kjanat/dprint-check@v3, with: { install-only: true } },
      run: task lint,
    ],
  }

  test: { name: Test, runs-on: *Ubuntu, steps: [*Check, *Mise, *Bun, { run: task test }] }
  client-test: { name: Go client test, runs-on: *Ubuntu, steps: [*Check, *MiseGo, { run: task c:t }, { run: task c:l }] }

  provenance:
    name: Commit provenance
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: *Ubuntu
    defaults: { run: { shell: bash } }
    steps:
      - { uses: *CheckoutAction, with: { fetch-depth: 0 } }
      - name: Check the pushed commits name a real author
        env: { BEFORE: "${{ github.event.before }}", AFTER: "${{ github.sha }}" }
        run: |
          # The first push to a branch reports an all-zero "before"; there is
          # no range to check then, and pre-existing history is repaired once
          # rather than re-litigated on every push.
          if [[ "${BEFORE}" =~ ^0+$ ]]; then
            echo "no previous tip recorded for this push; nothing to compare"
            exit 0
          fi
          .github/scripts/check-commit-provenance.sh "${BEFORE}..${AFTER}"
