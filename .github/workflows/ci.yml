name: CI
on: { push: { branches: [master] }, pull_request: { branches: [master] } }

jobs:
  verify-api:
    name: Verify API Generation
    runs-on: ubuntu-latest
    steps: [uses: actions/checkout@v7, uses: ./.github/actions/check-api-changes]

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps: [uses: actions/checkout@v7, uses: ./.github/actions/check-formatting]

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps: [
      uses: actions/checkout@v7,
      uses: jdx/mise-action@v4,
      uses: ./.github/actions/setup-bun,
      { run: task typecheck },
    ]

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps: [
      uses: actions/checkout@v7,
      { uses: jdx/mise-action@v4, with: { working_directory: client } },
      uses: ./.github/actions/setup-bun,
      uses: kjanat/install-dprint@v2,
      { run: task lint },
    ]

  test:
    name: Test
    runs-on: ubuntu-latest
    steps: [
      uses: actions/checkout@v7,
      uses: jdx/mise-action@v4,
      uses: ./.github/actions/setup-bun,
      { run: task test },
    ]

  client-test:
    name: Go client test
    runs-on: ubuntu-latest
    steps: [
      uses: actions/checkout@v7,
      { uses: jdx/mise-action@v4, with: { working_directory: client } },
      { run: task c:t },
      { run: task c:l },
    ]
