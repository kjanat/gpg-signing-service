name: Sign Commits

on:
  workflow_dispatch:
    inputs:
      base:
        description: Sign every commit after this ref (exclusive). Defaults to the merge base with the default branch.
        required: false
        default: ""
      allow_resign:
        description: Permit rewriting commits that already carry a signature
        type: boolean
        required: false
        default: false
      sign_others:
        description: Attach the signing key to commits committed by other identities
        type: boolean
        required: false
        default: false

permissions:
  id-token: write # Required for OIDC token
  contents: write # Required to push signed commits

jobs:
  sign:
    name: Sign Commits
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v7, with: { fetch-depth: 0 } }
      - { uses: ./.github/actions/setup-task }

      - name: Get OIDC Token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('gpg-signing-service');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Resolve Base
        id: base
        env:
          BASE_REF: ${{ inputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          BASE="${BASE_REF:-$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")}"
          echo "ref=${BASE}" >>"${GITHUB_OUTPUT}"
          echo "Signing range: ${BASE}..HEAD"

      - name: Sign Commits
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SIGNING_SERVICE_URL: ${{ vars.SIGNING_SERVICE_URL }}
          BASE_REF: ${{ steps.base.outputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_RESIGN: ${{ inputs.allow_resign }}
          SIGN_OTHERS: ${{ inputs.sign_others }}
        run: python3 .github/scripts/sign-commits.py

      - name: Verify Signatures
        env:
          SIGNING_SERVICE_URL: ${{ vars.SIGNING_SERVICE_URL }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          curl -fsS "${SIGNING_SERVICE_URL}/public-key" | gpg --import

          FAILED=0
          for commit in $(git rev-list "${BASE_REF}..HEAD"); do
            if ! git cat-file commit "${commit}" | grep -q '^gpgsig '; then
              echo "  unsigned ${commit} ($(git log -1 --format=%ce "${commit}"))"
            elif git verify-commit --raw "${commit}" 2>&1 | grep -q '^\[GNUPG:\] GOODSIG'; then
              echo "  ok       ${commit}"
            else
              echo "::error::Signature did not verify: ${commit}"
              git verify-commit "${commit}" || true
              FAILED=1
            fi
          done
          exit "${FAILED}"

      - name: Push Signed Commits
        run: git push origin HEAD --force-with-lease
