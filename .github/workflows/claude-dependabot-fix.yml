# Repair a Dependabot pull request whose CI failed, and push the fix.
#
# This workflow exists because the review workflow cannot do it. A run that
# Dependabot triggers from `pull_request` is treated by GitHub as if it came
# from a fork: the GITHUB_TOKEN is read-only whatever the `permissions:` block
# says, and `secrets.*` resolves from the Dependabot store rather than the
# Actions store. Adding `contents: write` there would only make the file lie.
#
# `workflow_run` is the elevation, chosen over the `pull_request_target` that
# GitHub's Dependabot documentation suggests, because it draws a cleaner line:
#
#   - it is not a Dependabot event, so it gets the Actions secrets and a
#     writable token;
#   - its GITHUB_SHA and GITHUB_REF are the default branch, so a checkout with
#     no `ref:` is master and cannot be made to be anything else;
#   - it does not run at all unless this file is on the default branch, so a
#     contributor cannot introduce a privileged workflow in their own branch;
#   - and it fires after CI, so the privileged path opens only when something
#     is actually broken.
#
# THE TRUST BOUNDARY
#
#   authorize  default branch only. Decides, from the API and not from the
#              event, whether this is an open Dependabot pull request in this
#              repository. Read-only.
#   propose    checks out the pull request and runs it — installs, builds,
#              tests, lets Claude fix it. `contents: read` and nothing else.
#              This job executes untrusted code and therefore holds no write
#              token. Its only output is a diff, uploaded as an artifact.
#   apply      holds the write token. Re-authorizes, then applies that diff to
#              a scratch checkout with git alone. Never installs, builds, tests
#              or sources anything from the branch. Its workspace stays on the
#              default branch, which is what keeps the commit-signing shim
#              trusted.
#
# The one-line version: the job that runs the code cannot push, and the job that
# pushes does not run the code. .github/scripts/test-dependabot-fix.sh asserts
# that against this file, and fails if a future edit blurs it.
#
# See docs/dependabot-fix-path.md for the whole design, including the secret
# provisioning that is NOT needed here and why.
name: Claude Dependabot Fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      head-ref: ${{ steps.gate.outputs.head-ref }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
    steps:
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - name: Authorize the Dependabot fix path
        id: gate
        run: bash .github/scripts/dependabot-fix-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  propose:
    name: Propose a fix
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      has-fix: ${{ steps.bundle.outputs.has-fix }}
    steps:
      - name: Check for Claude token
        env: { CLAUDE_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: printf 'HAS_CLAUDE_TOKEN=%s\n' "${CLAUDE_TOKEN:+true}" >> "${GITHUB_ENV}"
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head-sha }}
          path: pr
          persist-credentials: false
      - { uses: jdx/mise-action@v4 }
      - { uses: kjanat/install-dprint@v2 }
      - { uses: ./.github/actions/setup-bun, id: bun, with: { skip-install: true } }
      - name: Attempt a mechanical fix
        if: env.HAS_CLAUDE_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          show_full_output: true
          claude_args: --permission-mode bypassPermissions
          prompt: |
            The Dependabot pull request #${{ needs.authorize.outputs.pr-number }}
            is checked out at ./pr and its CI run failed.

            Work ONLY inside ./pr. Do not modify anything outside it.

            1. cd pr && bun install --ignore-scripts
            2. Reproduce the failure: task typecheck, task t, and task c:t if
               the Go client is affected.
            3. If the failure is mechanical, fix it and re-run until the suites pass.
            4. If it is NOT mechanical, change nothing. Say so and stop.

            Do NOT commit, and do NOT push. Leave your fix uncommitted in ./pr.

            Only these paths can be pushed; a change to anything else is
            discarded and the run is refused:
              bun.lock, package.json, go.work, go.work.sum, client/go.mod,
              client/go.sum, client/openapi.json, src/**.ts, client/**.go

            Append what you found and what you changed to $GITHUB_STEP_SUMMARY.

      - name: Bundle the fix
        id: bundle
        working-directory: pr
        run: |
          set -Eeuo pipefail
          git diff --no-color --no-ext-diff > "${RUNNER_TEMP}/fix.patch"
          if [[ -s "${RUNNER_TEMP}/fix.patch" ]]; then
            printf 'has-fix=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'has-fix=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload the fix
        if: steps.bundle.outputs.has-fix == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dependabot-fix
          path: ${{ runner.temp }}/fix.patch
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply and push
    needs: [authorize, propose]
    if: needs.propose.outputs.has-fix == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, pull-requests: write }
    steps:
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - name: Re-authorize before writing
        id: gate
        run: bash .github/scripts/dependabot-fix-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Download the fix
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/download-artifact@v6
        with: { name: dependabot-fix, path: "${{ runner.temp }}/fix" }
      - name: Set up service-signed commits
        if: steps.gate.outputs.eligible == 'true'
        id: signing
        uses: ./.github/actions/setup-claude-signing
        with:
          service-url: "${{ vars.SIGNING_SERVICE_URL }}"
          disable-signing: "${{ vars.GPG_SIGN_DISABLE }}"
      - name: Apply and push
        if: steps.gate.outputs.eligible == 'true'
        id: push
        run: bash .github/scripts/dependabot-fix-apply.sh "${RUNNER_TEMP}/fix/fix.patch"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.signing-enabled }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
      - name: Say what happened
        if: steps.push.outcome == 'success' && steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body \
            "Pushed a mechanical fix for the failing CI run. Computed in an unprivileged job that never held a write token, applied by a job that never ran this branch's code — see [the run](${RUN_URL}) and \`docs/dependabot-fix-path.md\`."
