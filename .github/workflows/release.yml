name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        type: string
        required: true

permissions: { contents: write }

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .release-tooling
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: .release-tooling/.github/scripts/validate-release-tag.sh

      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: client

      - name: Build binaries
        working-directory: client
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${RELEASE_TAG#v}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "${os}" = windows ] && ext=".exe"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" \
              -o "../dist/gpg-sign-${os}-${arch}${ext}" ./cmd/gpg-sign
          done

      - name: Make binaries executable
        working-directory: dist
        run: chmod +x gpg-sign-*

      - name: Create checksums
        working-directory: dist
        run: sha256sum ./* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/gpg-sign-linux-amd64
            dist/gpg-sign-linux-arm64
            dist/gpg-sign-darwin-amd64
            dist/gpg-sign-darwin-arm64
            dist/gpg-sign-windows-amd64.exe
            dist/gpg-sign-windows-arm64.exe
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      # softprops updates an existing release when a publish is retried. Its
      # generated-note path is not convergent: repeated publishers can append
      # the same GitHub-generated block again. GitHub also attributes each line
      # to the PR opener, which leaks @claude[bot] into release notes even when
      # the actual Git commits are Kaj-authored and service-signed. Normalize the
      # body after every publish so retries converge to exactly one block and the
      # public changelog reflects the repository owner rather than the agent that
      # happened to open a PR.
      - name: Normalize generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GH_REPO}/releases/tags/${NOTES_TAG}" --jq .id)"
          gh api "repos/${GH_REPO}/releases/tags/${NOTES_TAG}" --jq .body > current.md

          awk '
            BEGIN { seen = 0 }
            /^## What.s Changed$/ {
              if (seen) exit
              seen = 1
            }
            seen { print }
            seen && /^\*\*Full Changelog\*\*:/ { exit }
          ' current.md \
            | sed 's/by @claude\[bot\] in /by @kjanat in /g' \
            > normalized.md

          [[ "$(grep -c '^## What.s Changed$' normalized.md)" -eq 1 ]]
          if grep -Fq '@claude[bot]' normalized.md; then exit 1; fi
          grep -Fq '**Full Changelog**:' normalized.md

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            --raw-field body="$(cat normalized.md)" >/dev/null
