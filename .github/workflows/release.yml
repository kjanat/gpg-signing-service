name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        type: string
        required: true

permissions: { contents: write }

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      checksums: ${{ steps.subjects.outputs.checksums }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          path: .release-tooling
          persist-credentials: false

      - name: Validate release tag
        env: { RELEASE_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: .release-tooling/.github/scripts/validate-release-tag.sh

      - name: Drop release tooling before build
        run: rm -rf .release-tooling

      - name: Install toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with: { working_directory: client }

      - name: Build binaries
        working-directory: client
        env: { BUILD_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          LDFLAGS="-s -w -X main.version=${BUILD_TAG#v}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [[ "${os}" = windows ]] && ext=".exe"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" \
              -o "../dist/gpg-sign-${os}-${arch}${ext}" ./cmd/gpg-sign
          done

      - name: Make binaries executable
        working-directory: dist
        run: chmod +x gpg-sign-*

      - name: Generate SBOM
        working-directory: dist
        env:
          SBOM_TAG: "${{ inputs.tag || github.ref_name }}"
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
        run: syft scan dir:. --source-name gpg-sign --source-version "${SBOM_TAG#v}" -o spdx-json=gpg-sign.spdx.json

      - name: Upload SBOM for attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: dist/gpg-sign.spdx.json, if-no-files-found: error }

      - name: Create checksums
        id: subjects
        working-directory: dist
        run: |
          {
            echo 'checksums<<SUBJECTS'
            sha256sum gpg-sign-* | tee checksums.txt
            echo SUBJECTS
          } >> "${GITHUB_OUTPUT}"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/gpg-sign-linux-amd64
            dist/gpg-sign-linux-arm64
            dist/gpg-sign-darwin-amd64
            dist/gpg-sign-darwin-arm64
            dist/gpg-sign-windows-amd64.exe
            dist/gpg-sign-windows-arm64.exe
            dist/checksums.txt
            dist/gpg-sign.spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false

      # softprops updates an existing release when a publish is retried. Its
      # generated-note path is not convergent: repeated publishers can append
      # the same GitHub-generated block again. GitHub also attributes each line
      # to the PR opener, which leaks @claude[bot] into release notes even when
      # the actual Git commits are Kaj-authored and service-signed. Normalize the
      # body after every publish so retries converge to exactly one block and the
      # public changelog reflects the repository owner rather than the agent that
      # happened to open a PR.
      - name: Normalize generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GH_REPO}/releases/tags/${NOTES_TAG}" --jq .id)"
          gh api "repos/${GH_REPO}/releases/tags/${NOTES_TAG}" --jq .body > current.md

          awk '
            BEGIN { seen = 0 }
            /^## What.s Changed$/ {
              if (seen) exit
              seen = 1
            }
            seen { print }
            seen && /^\*\*Full Changelog\*\*:/ { exit }
          ' current.md \
            | sed 's/by @claude\[bot\] in /by @kjanat in /g' \
            > normalized.md

          changed="$(grep -c '^## What.s Changed$' normalized.md)"
          [[ "${changed}" -eq 1 ]]
          if grep -Fq '@claude[bot]' normalized.md; then exit 1; fi
          grep -Fq '**Full Changelog**:' normalized.md

          normalized="$(cat normalized.md)"
          gh api \
            --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            --raw-field body="${normalized}" >/dev/null

  attest:
    name: Attest build provenance
    needs: release
    runs-on: ubuntu-latest
    permissions: { attestations: write, id-token: write }
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sbom }

      - name: Write attestation subjects
        env: { SUBJECTS: "${{ needs.release.outputs.checksums }}" }
        run: printf '%s\n' "${SUBJECTS}" > checksums.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
          sbom-path: gpg-sign.spdx.json
