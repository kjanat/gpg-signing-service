name: D1 Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: D1 environment to migrate
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency: d1-migrate-${{ inputs.environment }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Apply production migrations
        if: inputs.environment == 'production'
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: wrangler d1 migrations apply AUDIT_DB --remote
      - name: Apply staging migrations
        if: inputs.environment == 'staging'
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: wrangler d1 migrations apply AUDIT_DB --remote --env staging
