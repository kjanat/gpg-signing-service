name: D1 Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: D1 environment to migrate
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency: d1-migrate-${{ inputs.environment }}

jobs:
  migrate:
    if: github.ref == 'refs/heads/master'
    environment: ${{ inputs.environment }}
    env: { ENVIRONMENT: "${{ case(inputs.environment != 'production', inputs.environment, '') }}", DB: AUDIT_DB }
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - { uses: actions/checkout@v7, with: { persist-credentials: false } }
      - { uses: jdx/mise-action@v4 }
      - name: Apply ${{ inputs.environment }} migrations
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: wrangler d1 migrations apply "${DB}" --remote --env="${ENVIRONMENT}"
