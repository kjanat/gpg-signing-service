name: Repair History
# NOT ACTIVE YET. This file is in .github/workflows-pending/ because a GitHub
# App token has no `workflows` permission and cannot write under
# .github/workflows/ — the push is rejected outright, and the rejection kills
# the whole push rather than just that file. It ADDS a workflow; it replaces
# nothing. Activate it with:
#
#   git mv .github/workflows-pending/repair-history.yml \
#     .github/workflows/repair-history.yml
#
# A SEPARATE workflow rather than a mode on Sign Commits, for the same reason
# `repair-history` is a separate command from `sign-commit`: signing attests to
# what a commit already says, and this rewrites what it says about who wrote
# it. A `mode:` dropdown would put a provenance rewrite one mis-click away from
# a routine signing run.
#
# Everything dangerous here is off unless it is asked for. `dry_run` defaults
# to true, `push` defaults to false, and none of the four bounds has a default
# at all — .github/scripts/repair-history.sh refuses a blank one rather than
# guessing, and `gpg-sign repair-history` refuses again underneath it. Tests:
# .github/scripts/test-repair-history.sh (`task test:repair-history`).

on:
  workflow_dispatch:
    inputs:
      base:
        description: Exclusive lower bound of the range. Required; there is no default.
        type: string
        required: true
      expected_tip:
        description: The commit the branch must currently point at. Read it immediately before dispatching.
        type: string
        required: true
      identity:
        description: The identity to write into both headers, as "Name <address>"
        type: string
        required: true
        default: Kaj Kowalski <info@kajkowalski.nl>
      expect_identities:
        description: Addresses the range is allowed to carry now, comma-separated. Every one must be named.
        type: string
        required: true
      dry_run:
        description: Plan only. Signs nothing, writes nothing, pushes nothing.
        type: boolean
        required: false
        default: true
      push:
        description: Publish the repaired tip with one --force-with-lease. Off unless asked for.
        type: boolean
        required: false
        default: false
      build_from_source:
        description: Run the checked-out CLI instead of the installed release. For a repair the release predates.
        type: boolean
        required: false
        default: false

permissions:
  id-token: write # Required for OIDC token
  contents: write # Required to publish the repaired tip

jobs:
  repair:
    name: Repair Provenance
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v7, with: { fetch-depth: 0 } }
      - { uses: ./ }

      # Deliberate, named, and off by default. `repair-history` is newer than
      # some releases, and this is the one-shot repair that may have to run
      # before a release carries it. It must not become the ordinary path: the
      # routine signing workflow has no such input.
      # The toolchain is set up the way .github/workflows/ci.yml sets it up for
      # the Go client: mise resolves the Go version from client/go.mod, and
      # client:build reads the CLI version out of package.json with bun.
      - { uses: jdx/mise-action@v4, if: inputs.build_from_source, with: { working_directory: client } }
      - { uses: ./.github/actions/setup-bun, if: inputs.build_from_source }
      - name: Build the checked-out CLI
        if: inputs.build_from_source
        id: build
        run: |
          task client:build
          echo "bin=${PWD}/client/bin/gpg-sign" >>"${GITHUB_OUTPUT}"

      - name: Get OIDC Token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('gpg-signing-service');
            core.setSecret(token);
            core.setOutput('token', token);

      # `gpg-sign repair-history` rewrites and signs; the script then re-checks
      # every commit with git and gpg — independently of the CLI's own OpenPGP
      # code — and only then performs one --force-with-lease naming the exact
      # object it replaces. A dry run stops before any of that.
      - name: Repair, assert and publish
        env:
          GPG_SIGN_TOKEN: ${{ steps.oidc.outputs.token }}
          GPG_SIGN_URL: ${{ vars.SIGNING_SERVICE_URL }}
          GPG_SIGN_BIN: ${{ steps.build.outputs.bin }}
          BASE_REF: ${{ inputs.base }}
          EXPECTED_TIP: ${{ inputs.expected_tip }}
          IDENTITY: ${{ inputs.identity }}
          EXPECT_IDENTITIES: ${{ inputs.expect_identities }}
          BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUSH: ${{ inputs.push }}
        run: |
          # One dispatch field takes a comma-separated list; the script takes
          # one address per line. And an unset GPG_SIGN_BIN must be absent
          # rather than empty, or it names the empty string as the binary.
          EXPECT_IDENTITIES="$(printf '%s' "${EXPECT_IDENTITIES}" | tr ',' '\n')"
          export EXPECT_IDENTITIES
          [[ -n "${GPG_SIGN_BIN}" ]] || unset GPG_SIGN_BIN
          .github/scripts/repair-history.sh
