name: autofix.ci
on: { push: { branches: [master] }, pull_request: null }
permissions: { contents: read }
jobs:
  autofix:
    # An autofix commit pushed to a stacked PR rewrites a layer the merge queue coordinates
    if: contains(fromJSON('["push", "pull_request"]'), github.event_name) && github.event.pull_request.stack == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with: { version: "${{ vars.MISE_VERSION }}" }
      - uses: kjanat/actions@fmt
      - uses: autofix-ci/action@v1
