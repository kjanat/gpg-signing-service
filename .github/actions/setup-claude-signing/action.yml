name: Setup service-signed commits
description: >-
  Configure git so every commit made in this job (including commits made by
  Claude Code) is GPG-signed by our own gpg-signing-service. Dogfooding: the
  service authenticates the workflow via GitHub OIDC, signs the raw commit
  object, and git attaches the signature — every @claude run doubles as a live
  integration test of the /sign endpoint.

  Requires `id-token: write` on the calling job (the shim mints a fresh OIDC
  token per signature — see .github/scripts/gpg-sign-git-program.sh).

inputs:
  service-url:
    description: Base URL of the signing service (e.g. vars.SIGNING_SERVICE_URL)
    required: true

runs:
  using: composite
  steps:
    # Repo-root action: downloads a released gpg-sign binary onto PATH
    - uses: ./

    - shell: bash
      env:
        SERVICE_URL: ${{ inputs.service-url }}
      run: |
        shim="${GITHUB_WORKSPACE}/.github/scripts/gpg-sign-git-program.sh"
        chmod +x "$shim"
        git config --local gpg.program "$shim"
        git config --local commit.gpgsign true
        # gpg.program is only consulted when gpg.format is openpgp. A runner (or
        # an agent image) that presets gpg.format=ssh would otherwise silently
        # sign with its own key and never call the service.
        git config --local gpg.format openpgp
        # Exported so the shim (invoked by git, possibly deep inside a Claude
        # session) knows where the service lives.
        echo "GPG_SIGN_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

        # Re-export the OIDC request variables under our own names, because
        # claude-code-action deletes the native ones from the environment it
        # hands to Claude:
        #
        #   // Remove OIDC token request variables so Claude cannot mint new tokens.
        #   delete env.ACTIONS_ID_TOKEN_REQUEST_URL;
        #   delete env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
        #   -- base-action/src/parse-sdk-options.ts
        #
        # That is why signing failed with "job needs id-token: write" on a job
        # that had it (issue #25) — the permission was never the problem.
        #
        # SECURITY: this deliberately re-grants the agent that capability. The
        # request URL is a general-purpose minting endpoint, so the session can
        # mint a repo-scoped OIDC token for ANY audience, not just
        # gpg-signing-service. Acceptable only while this repo's identity is not
        # trusted by any external OIDC relying party (AWS/GCP/Vault role, etc).
        # Before adding one, switch to a pre-minted audience-scoped token or a
        # gst_ service token instead. See docs/cloud-session-signing.md.
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::add-mask::${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          {
            echo "GPG_OIDC_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL}"
            echo "GPG_OIDC_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          } >> "$GITHUB_ENV"
          echo "OIDC request variables propagated; commits will be service-signed."
        else
          # Loud, because the alternative is discovering it only when a commit
          # fails minutes into an agent run. Note commits FAIL rather than fall
          # back to unsigned: commit.gpgsign is on and the shim exits 1 with no
          # credential, so git refuses to write the commit object.
          echo "::warning title=Commit signing unavailable::ACTIONS_ID_TOKEN_REQUEST_* absent in this step, so the job likely lacks 'id-token: write'. Every commit in this job will FAIL (not silently go unsigned) unless GPG_SIGN_TOKEN is set."
        fi
        # NOTE: commits will show as "Unverified" on github.com unless the
        # service's public key (/public-key) is uploaded to a GitHub account
        # whose email matches the committer identity. The signature itself is
        # still real and verifiable: git log --show-signature after importing
        # the key from ${SERVICE_URL}/public-key.
