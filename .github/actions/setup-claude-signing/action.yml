name: Setup service-signed commits
description: >-
  Configure git so every commit made in this job (including commits made by
  Claude Code) is GPG-signed by our own gpg-signing-service. Dogfooding: the
  service authenticates the workflow via GitHub OIDC, signs the raw commit
  object, and git attaches the signature — every @claude run doubles as a live
  integration test of the /sign endpoint.

  Requires `id-token: write` on the calling job (the shim mints a fresh OIDC
  token per signature — see .github/scripts/gpg-sign-git-program.sh).

  gpg.program stays a drop-in GnuPG for everything else: the shim claims only
  the detached-sign invocation and delegates the rest — `git log
  --show-signature`, `git tag -v`, `--verify-signatures` — to the runner's gpg.

inputs:
  service-url:
    description: Base URL of the signing service (e.g. vars.SIGNING_SERVICE_URL)
    required: true
  claude-settings:
    description: Existing Claude Code settings JSON or path to a settings file
    required: false
    default: "{}"

outputs:
  settings-file:
    description: Path to Claude settings extended with the signing environment
    value: ${{ steps.configure.outputs.settings-file }}

runs:
  using: composite
  steps:
    # Repo-root action: downloads a released gpg-sign binary onto PATH
    - uses: ./

    - id: configure
      shell: bash
      env:
        CLAUDE_SETTINGS: "${{ inputs.claude-settings }}"
        SERVICE_URL: "${{ inputs.service-url }}"
      run: |
        set -Eeuo pipefail

        readonly github_workspace="${GITHUB_WORKSPACE-}"
        readonly github_env="${GITHUB_ENV-}"
        readonly github_output="${GITHUB_OUTPUT-}"
        readonly runner_temp="${RUNNER_TEMP-}"
        readonly service_url="${SERVICE_URL-}"
        readonly claude_settings="${CLAUDE_SETTINGS-}"
        readonly oidc_request_url="${ACTIONS_ID_TOKEN_REQUEST_URL-}"
        readonly oidc_request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}"

        if [[ -z "${github_workspace}" || -z "${github_env}" || -z "${github_output}" || -z "${runner_temp}" ]]; then
          printf '%s\n' '::error title=Commit signing unavailable::Required GitHub Actions paths are missing'
          exit 1
        fi

        readonly shim="${github_workspace}/.github/scripts/gpg-sign-git-program.sh"

        if [[ -z "${service_url}" ]]; then
          printf '%s\n' '::error title=Commit signing unavailable::service-url is empty'
          exit 1
        fi
        if [[ -z "${oidc_request_url}" || -z "${oidc_request_token}" ]]; then
          printf '%s\n' '::error title=Commit signing unavailable::The job must grant id-token: write'
          exit 1
        fi

        chmod +x "${shim}"
        git config --local gpg.program "${shim}"
        git config --local gpg.format openpgp
        git config --local commit.gpgsign true

        # The regular action environment reaches claude-code-action itself, but
        # only settings.env is guaranteed to reach Claude Code's Bash tools.
        # Use neutral names so the runner-provided ACTIONS_* credentials do not
        # cross that process boundary under reserved names.
        #
        # The neutral names are also what makes this work at all: the native
        # variables never reach the session, because claude-code-action deletes
        # them on purpose (base-action/src/parse-sdk-options.ts):
        #
        #   // Remove OIDC token request variables so Claude cannot mint new tokens.
        #   delete env.ACTIONS_ID_TOKEN_REQUEST_URL;
        #   delete env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
        #
        # That is why signing failed with "job needs id-token: write" on a job
        # that had it (issue #25) — the permission was never the problem.
        #
        # SECURITY: this deliberately re-grants the agent that capability. The
        # request URL is a general-purpose minting endpoint, so the session can
        # mint a repo-scoped OIDC token for ANY audience, not just
        # gpg-signing-service. Acceptable only while this repo's identity is not
        # trusted by any external OIDC relying party (AWS/GCP/Vault role, etc).
        # Before adding one, switch to a pre-minted audience-scoped token or a
        # gst_ service token instead. See docs/cloud-session-signing.md.
        printf '::add-mask::%s\n' "${oidc_request_url}"
        printf '::add-mask::%s\n' "${oidc_request_token}"

        {
          printf 'GPG_SIGN_URL=%s\n' "${service_url}"
          printf 'GPG_OIDC_REQUEST_URL=%s\n' "${oidc_request_url}"
          printf 'GPG_OIDC_REQUEST_TOKEN=%s\n' "${oidc_request_token}"
        } >>"${github_env}"

        if [[ -z "${claude_settings}" ]]; then
          settings='{}'
        elif [[ -f "${claude_settings}" ]]; then
          settings="$(<"${claude_settings}")"
        else
          settings="${claude_settings}"
        fi

        if ! jq -e 'type == "object"' >/dev/null <<<"${settings}"; then
          printf '%s\n' '::error title=Invalid Claude settings::claude-settings must be a JSON object or a path to one'
          exit 1
        fi

        umask 077
        settings_file="$(mktemp "${runner_temp}/claude-signing-settings.XXXXXX")"
        jq \
          --arg service_url "${service_url}" \
          --arg oidc_url "${oidc_request_url}" \
          --arg oidc_token "${oidc_request_token}" \
          '.env = ((.env // {}) + {
            "GPG_SIGN_URL": $service_url,
            "GPG_OIDC_REQUEST_URL": $oidc_url,
            "GPG_OIDC_REQUEST_TOKEN": $oidc_token
          })' <<<"${settings}" >"${settings_file}"
        printf 'settings-file=%s\n' "${settings_file}" >>"${github_output}"

        # GitHub will show commits as "Unverified" unless the service's public key
        # (/public-key) is uploaded to a GitHub account whose email matches the
        # committer identity. The signature itself remains valid and can be verified
        # with `git log --show-signature` after importing:
        # ${SERVICE_URL}/public-key
        #
        # That verification works with gpg.program still pointing at the shim: it
        # claims only the detached-sign invocation and delegates --verify to the
        # runner's gpg. What a job does need first is the key itself, which is not
        # in the runner keyring — so a step that verifies signatures should import
        # it. This action deliberately does not, to keep signing jobs off a network
        # call they do not use:
        #
        #   curl -sf "${SERVICE_URL}/public-key" | gpg --import
