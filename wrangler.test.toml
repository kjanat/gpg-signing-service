#:schema node_modules/wrangler/config-schema.json

name                = "gpg-signing-service-test"
main                = "src/index.ts"
compatibility_date  = "2026-07-12"
compatibility_flags = ["nodejs_compat"]
observability       = { enabled = true }

# Durable Objects
[[durable_objects.bindings]]
name       = "KEY_STORAGE"
class_name = "KeyStorage"

[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name       = "WEBHOOK_DELIVERIES"
class_name = "WebhookDeliveries"

# Migrations for Durable Objects
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["KeyStorage", "RateLimiter"]

[[migrations]]
tag                = "v2"
new_sqlite_classes = ["WebhookDeliveries"]

# D1 Database for audit logs (use local database for tests)
[[d1_databases]]
binding       = "AUDIT_DB"
database_name = "gpg-signing-audit-test"
database_id   = "test-database-id"

# KV for JWKS caching (use local KV for tests)
[[kv_namespaces]]
binding = "JWKS_CACHE"
id      = "test-kv-id"

# Custom domain
[[routes]]
pattern       = "test-gpg.kajkowalski.nl"
custom_domain = true

# Environment variables for testing
[vars]
ALLOWED_ISSUERS = "https://token.actions.githubusercontent.com,https://gitlab.com,https://token.actions.githubusercontent.com/unique-test-issuer"
KEY_ID          = "62E75E54497815DD"
ADMIN_TOKEN     = "test-admin-token"
KEY_PASSPHRASE  = "test-passphrase"

# SENTRY_DSN is deliberately absent. The whole suite therefore runs against the
# disabled path, which is what makes "an unset DSN changes nothing" a property
# every one of these tests checks rather than an assertion in one of them.
# `sentry.test.ts` builds its own client, with a recording transport and a DSN
# that resolves to nothing, to exercise the enabled path.

# The read-only admin credential the monitoring workflow holds. Distinct from
# ADMIN_TOKEN on purpose — equal values are a refused configuration, and
# `admin-scope.test.ts` pins that refusal.
ADMIN_READONLY_TOKEN = "test-readonly-admin-token"

# The GitHub App integration ships off, and the suite asserts that a deployment
# in this state is indistinguishable from one without the code. Every test that
# needs the feature on supplies its own env, so leaving the default here as the
# shipped default is what keeps "off" covered by every other suite in the tree
# rather than by one assertion.
GITHUB_APP_ENABLED          = "false"
# Check-run reporting ships off too, and the suite asserts that an enabled
# integration with this unset makes no Checks API call at all. The tests that
# want it on supply their own env.
GITHUB_APP_CHECK_RUNS       = "false"
# Claude dispatch ships off as well, and the suite asserts that an enabled
# integration with this unset makes no Actions API call at all — not even the
# permission lookup, which is a GitHub call an arbitrary commenter must not be
# able to cause. The tests that want it on supply their own env, including the
# workflow and ref, which have no defaults.
GITHUB_APP_COMMENT_DISPATCH = "false"
GITHUB_APP_ID               = "123456"
GITHUB_WEBHOOK_SECRET       = "test-webhook-secret"

# GITHUB_APP_ALLOWED_REPOSITORIES is deliberately absent, so the default the
# whole suite runs against is the fail-closed one: no installation and no
# repository authorized. Every test that needs a grant supplies its own, which
# is what keeps "an unset allowlist grants nothing" a property the other suites
# demonstrate rather than one assertion demonstrating it alone.
