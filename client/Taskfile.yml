# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
---
version: "3"

vars:
  OAPI_CODEGEN_CONFIG: oapi-codegen.yaml
  OPENAPI_SPEC: openapi.json
  GOLANGCI_LINT_CONFIG: .golangci.yml

tasks:
  default:
    silent: true
    desc: Show available tasks and build the CLI
    cmds:
      - "{{.TASK_EXE}} --taskfile {{.TASKFILE}} --list"
      - echo "To some tasks you CAN pass arguments using '{{.TASK_EXE}} client:<task> -- <args>'"
      - task: build

  test:
    desc: Run Go tests *args
    aliases: [t]
    cmd: go test ./... {{.CLI_ARGS}}

  test:coverage:
    desc: Run Go tests with coverage *args
    aliases: [tc]
    cmd: go test -cover ./... {{.CLI_ARGS}}

  test:watch:
    desc: Run Go tests in watch mode *args
    aliases: [tw]
    cmd: go test -cover ./... -run {{.CLI_ARGS}} -watch

  build:
    desc: Build the CLI
    aliases: [b, make]
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    vars:
      COMMIT_HASH:
        sh: git rev-parse HEAD
      BUILD_TIME:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
      VERSION:
        sh: bun pm pkg get version --cwd=../ | tr -d "\""
    cmds:
      - go mod tidy
      - |
        go build -trimpath -o bin/gpg-sign \
          -ldflags "-s -w -X main.commitHash={{.COMMIT_HASH}} -X main.buildTime={{.BUILD_TIME}} -X main.version={{.VERSION}}" \
          ./cmd/gpg-sign

  generate:
    desc: Generate Go client code
    aliases: [gen, g]
    cmd: go tool oapi-codegen -config {{.OAPI_CODEGEN_CONFIG}} {{.OPENAPI_SPEC}}

  lint:
    desc: Lint Go code *args
    aliases: [l]
    cmds:
      - golangci-lint run --config={{.GOLANGCI_LINT_CONFIG}} {{.CLI_ARGS}}
      # golangci-lint carries none of the toolchain's modernize analyzers, so a
      # 1.27 modernization lands with the line above green -- #115 did exactly
      # that, and only an explicit `task c:m -- -diff` caught it. Chaining the
      # dry run here is what puts it in CI: `.github/workflows/ci.yml` runs
      # `task c:l` in the Go client job, and nothing else in that job would.
      - task: modernize:check

  lint:fix:
    desc: Lint and fix Go code *args
    aliases: [lf]
    cmds:
      - golangci-lint run --fix --config={{.GOLANGCI_LINT_CONFIG}} {{.CLI_ARGS}}

  format:
    desc: Format Go code *args
    aliases: [fmt, f]
    cmds:
      - golangci-lint fmt --config={{.GOLANGCI_LINT_CONFIG}} {{.CLI_ARGS}}

  # Go 1.27 ships the modernize analyzers inside the toolchain as `go fix`, so
  # this no longer downloads an unversioned gopls-internal command on every
  # run: the fixers are exactly the ones the toolchain go.mod pins, they cover
  # _test.go files by default, and `go fix -diff` is a CI-shaped dry run.
  modernize:
    desc: Modernize Go code *args
    aliases: [m]
    cmd: go fix {{.CLI_ARGS}} ./...

  # The enforcement half of `modernize`, spelled through it so the fixer
  # invocation stays defined once. `-diff` writes nothing and exits non-zero on
  # a non-empty fixer diff, which is the whole gate -- there is no Go version
  # pinned anywhere in it, the fixers are whichever ones the toolchain that
  # client/go.mod selects happens to ship. scripts/test-go-modernize-gate.sh
  # holds both of those properties down.
  modernize:check:
    desc: Fail on a pending toolchain modernization (dry run, writes nothing)
    aliases: [mc]
    cmds:
      - task: modernize
        vars: { CLI_ARGS: -diff }
