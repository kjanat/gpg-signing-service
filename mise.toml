#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

monorepo_root = true

[tools]
biome          = "2.6.8"
bun            = "latest"
cargo-binstall = "latest"
gitleaks       = { prefix = "8" }
go             = "1.27.4"
golangci-lint  = "2.15.0"
lefthook       = "latest"
node           = "26"
runner-run     = "latest"
rshellcheck    = { version = "latest", rename_exe = "shellcheck" }
task           = "latest"
tombi          = { prefix = "1" }
typescript     = { filter_bins = ["tsc"], version = "latest" }
tsrs           = "latest"
uv             = "0.13.9"
syft           = "latest"
oapi-codegen   = "2.8.2"
python         = "3.15"

[tools."http:actionlint"]
version          = "master"
url              = 'https://pkg.pr.new/kjanat/actionlint/@kjanat-actionlint/actionlint-{{ os(macos="darwin", windows="win32") }}-{{ arch() }}@{{ version }}'
format           = "tar.gz"
strip_components = 1
bin_path         = "bin"

[tools.wrangler]
version      = "4.165.0"
allow_builds = ["esbuild", "sharp", "workerd"]

[tool_alias]
runner-run   = "github:kjanat/runner"
tombi        = "aqua:tombi-toml/tombi"
typescript   = "github:Microsoft/TypeScript"
rshellcheck  = "cargo:rshellcheck"
tsrs         = "npm:tsrs"
oapi-codegen = "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen"

[settings]
idiomatic_version_file_enable_tools = ["go", "python", "bun"]

[monorepo]
config_roots = ["."]

[deps]
bun = { auto = true, run = "bun install --ignore-scripts" }
go  = { auto = true, run = "go mod tidy", dir = "client" }
uv  = { auto = true, run = "uv sync" }
