# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
# https://lefthook.dev/configuration/
---
pre-commit:
  jobs:
    - { name: lint, run: "task lint:fix", stage_fixed: true }
    - { name: format, run: "task format:staged", stage_fixed: true }
    - { name: typegen, run: task typegen }
    - { name: generate-api, run: "task generate:api" }
    - name: "git: add auto-generated files"
      run: git add
        client/openapi.json
        client/pkg/api/api.gen.go
pre-push:
  jobs:
    - { name: typecheck, run: task typecheck }
    - { name: test coverage, run: "env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE task test:coverage" }
# Validate commit messages
commit-msg:
  commands: { "lint commit message": { run: "bunx commitlint --edit {1}" } }
